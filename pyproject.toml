[project]
name = "polycrawler"
version = "0.2.0"
description = "Backtest-first Polymarket cluster copy research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
pc2 = "polycrawler.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polycrawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["N802", "N803", "N806", "N815", "N816"]
